<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MOCHIPRO6171</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:
    radial-gradient(circle at top left,#ffb86b22,transparent 30%),
    radial-gradient(circle at bottom right,#ff8c4222,transparent 30%),
    linear-gradient(135deg,#151515,#222222);
  min-height:100vh;
  color:white;
}

.container{
  width:100%;
  max-width:1100px;
  margin:auto;
  padding:40px 20px 80px;
}

.hero{
  text-align:center;
  margin-bottom:40px;
}

.logo{
  font-size:60px;
  font-weight:700;
  background:linear-gradient(90deg,#ffcc70,#ff9f43);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  margin-bottom:10px;
}

.subtitle{
  opacity:0.8;
  line-height:1.8;
}

.badge{
  display:inline-block;
  margin-top:15px;
  padding:6px 14px;
  border-radius:999px;
  background:rgba(255,179,71,0.12);
  color:#ffcc70;
  font-size:12px;
  border:1px solid rgba(255,179,71,0.15);
}

.search-container{
  position:sticky;
  top:15px;
  z-index:999;
  margin-bottom:25px;
}

.search-input{
  width:100%;
  border:none;
  outline:none;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.08);
  color:white;
  font-size:18px;
  padding:20px 24px;
  border-radius:24px;
  transition:0.3s;
}

.search-input:focus{
  background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,179,71,0.5);
  box-shadow:0 0 0 4px rgba(255,179,71,0.15);
}

.search-input::placeholder{
  color:#cfcfcf;
}

.result-info{
  margin-bottom:20px;
  opacity:0.8;
}

.results{
  display:grid;
  gap:18px;
}

.card{
  background:rgba(255,255,255,0.07);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:24px;
  padding:22px;
  transition:0.3s;
}

.card:hover{
  transform:translateY(-4px);
  background:rgba(255,255,255,0.1);
}

.kode{
  display:inline-flex;
  background:linear-gradient(90deg,#ffcc70,#ff9f43);
  color:#222;
  padding:6px 14px;
  border-radius:999px;
  font-weight:700;
  font-size:13px;
  margin-bottom:12px;
}

.profesi{
  font-size:24px;
  font-weight:600;
  margin-bottom:12px;
}

.keyword{
  opacity:0.72;
  line-height:1.8;
  font-size:14px;
}

.meta-row{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:16px;
}

.meta-pill{
  padding:6px 12px;
  border-radius:999px;
  font-size:12px;
  background:rgba(255,179,71,0.12);
  border:1px solid rgba(255,179,71,0.15);
  color:#ffcc70;
}

.related-box{
  margin-top:16px;
  padding-top:14px;
  border-top:1px dashed rgba(255,255,255,0.1);
}

.related-title{
  font-size:13px;
  opacity:0.7;
  margin-bottom:10px;
}

.related-list{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.related-item{
  background:rgba(255,255,255,0.08);
  border-radius:999px;
  padding:6px 12px;
  font-size:12px;
}

.empty,
.loading{
  text-align:center;
  opacity:0.7;
  margin-top:50px;
  line-height:1.8;
}

.footer{
  margin-top:70px;
  text-align:center;
  opacity:0.45;
  font-size:13px;
}

@media(max-width:768px){

  .logo{
    font-size:42px;
  }

  .profesi{
    font-size:20px;
  }

  .search-input{
    font-size:16px;
    padding:18px 20px;
  }

}

</style>
</head>
<body>

<div class="container">

  <div class="hero">

    <div class="logo">
      🍡 MOCHIPRO6171
    </div>

    <div class="subtitle">
      Mesin Otomatis Coding Hasil Isian Profesi<br>
      AI Smart Search Kode Profesi SE2026
    </div>

    <div class="badge">
      AI Semantic Search + NLP Indonesia
    </div>

  </div>

  <div class="search-container">

    <input
      type="text"
      id="searchInput"
      class="search-input"
      placeholder="Cari pekerjaan... contoh: jual online, ngojek, guru les, tukang kopi"
    >

  </div>

  <div class="result-info" id="resultInfo"></div>

  <div class="results" id="results"></div>

  <div class="footer">
    MOCHIPRO6171 • AI Occupation Matching Engine
  </div>

</div>

<script>

const SHEET_ID = '1IkV4zeEJ0k2P_xdMZGrLrWZrvG-tvahDLO5hRf8yxXQ';
const SHEET_NAME = 'DATA';

const CSV_URL =
`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${SHEET_NAME}`;

let database = [];
let fuse;

const hierarchyMap = {

  'transportasi': [
    'Pengemudi Ojek Online',
    'Pengemudi Ojek Pangkalan',
    'Sopir',
    'Kurir',
    'Pilot',
    'Pramugara/i',
    'Kapten Kapal',
    'Nakhoda'
  ],

  'kesehatan': [
    'Dokter Umum',
    'Dokter Gigi',
    'Dokter Spesialis',
    'Perawat',
    'Bidan',
    'Psikiater',
    'Psikolog',
    'Apoteker'
  ],

  'pendidikan': [
    'Guru',
    'Dosen',
    'Pelatih/Instruktur Olahraga'
  ],

  'perdagangan': [
    'Pedagang',
    'Pedagang Online',
    'Pedagang Asongan/Keliling Makanan',
    'Pedagang Asongan/Keliling Nonmakanan',
    'Pekerja Profesional Penjualan'
  ],

  'pemerintahan': [
    'Presiden',
    'Menteri/Kepala Badan (setingkat Menteri)/Wakil Menteri/Wakil Kepala Badan',
    'Gubernur',
    'Walikota',
    'Bupati',
    'Camat',
    'Kepala Desa',
    'Perangkat Desa'
  ]

};

const synonymMap = {

  'ngajar': 'guru',
  'ngojek': 'ojek online',
  'gojek': 'ojek online',
  'grab': 'ojek online',
  'jualan': 'pedagang',
  'barber': 'tukang cukur',
  'mua': 'penata rias',
  'driver': 'sopir',
  'ngecat': 'tukang cat',
  'masak': 'juru masak',
  'kopi': 'barista',
  'coding': 'programmer',
  'programming': 'programmer',
  'konten': 'kreator konten',
  'youtube': 'kreator konten',
  'tiktok': 'kreator konten',
  'ngejahit': 'penjahit'

};

const searchInput = document.getElementById('searchInput');
const resultsContainer = document.getElementById('results');
const resultInfo = document.getElementById('resultInfo');

const fuseOptions = {
  includeScore: true,
  threshold: 0.4,
  ignoreLocation: true,
  minMatchCharLength: 2,

  keys: [
    { name: 'kode', weight: 0.3 },
    { name: 'profesi', weight: 0.7 },
    { name: 'keyword', weight: 1 }
  ]
};

async function loadData(){

  try{

    resultsContainer.innerHTML =
      `<div class="loading">🍡 Memuat database AI profesi...</div>`;

    const response = await fetch(CSV_URL);

    const csvText = await response.text();

    const parsed = Papa.parse(csvText,{
      header:true,
      skipEmptyLines:true
    });

    database = parsed.data.map(item => ({
      kode: item.kode || '',
      profesi: item.profesi || '',
      keyword: item.keyword || ''
    }));

    fuse = new Fuse(database, fuseOptions);

    resultsContainer.innerHTML = `
      <div class="empty">
        🍡 AI profession engine berhasil dimuat.<br>
        Mulai ketik pekerjaan untuk mencari rekomendasi profesi.
      </div>
    `;

  }catch(error){

    console.error(error);

    resultsContainer.innerHTML = `
      <div class="empty">
        Gagal memuat database spreadsheet 😢
      </div>
    `;

  }

}

function normalize(text){

  return text
    .toLowerCase()
    .replace(/[^a-z0-9\s]/g,' ')
    .replace(/\s+/g,' ')
    .trim();

}

function applyNLP(query){

  query = normalize(query);

  Object.keys(synonymMap).forEach(key => {

    const regex = new RegExp(`\\b${key}\\b`, 'g');

    query = query.replace(regex, synonymMap[key]);

  });

  return query;

}

function getHierarchy(profesi){

  for(const category in hierarchyMap){

    if(hierarchyMap[category].includes(profesi)){
      return category;
    }

  }

  return 'lainnya';

}

function getRelatedProfessions(profesi){

  const category = getHierarchy(profesi);

  if(category === 'lainnya') return [];

  return hierarchyMap[category]
    .filter(item => item !== profesi)
    .slice(0,4);

}

function semanticBoost(query, item){

  let score = 0;

  const q = normalize(query);

  const hierarchy = getHierarchy(item.profesi);

  if(q.includes('transport') && hierarchy === 'transportasi'){
    score += 20;
  }

  if(q.includes('kesehatan') && hierarchy === 'kesehatan'){
    score += 20;
  }

  if(q.includes('ngajar') && hierarchy === 'pendidikan'){
    score += 20;
  }

  if(q.includes('jualan') && hierarchy === 'perdagangan'){
    score += 20;
  }

  return score;

}

function search(query){

  if(!query.trim()){

    resultInfo.innerHTML = '';

    resultsContainer.innerHTML = `
      <div class="empty">
        🍡 Ketik kata kunci pekerjaan untuk mulai mencari.
      </div>
    `;

    return;

  }

  if(!fuse) return;

  const processedQuery = applyNLP(query);

  let results = fuse.search(processedQuery)
    .map(result => {

      const semanticScore = semanticBoost(processedQuery, result.item);

      const aiScore =
        Math.round(
          ((1 - result.score) * 100) + semanticScore
        );

      return {
        ...result.item,
        aiScore,
        related: getRelatedProfessions(result.item.profesi),
        hierarchy: getHierarchy(result.item.profesi)
      };

    })
    .sort((a,b)=>b.aiScore-a.aiScore)
    .slice(0,20);

  renderResults(results,query,processedQuery);

}

function renderResults(results,originalQuery,processedQuery){

  if(results.length === 0){

    resultsContainer.innerHTML = `
      <div class="empty">
        Tidak ditemukan profesi yang cocok 😢
      </div>
    `;

    return;

  }

  resultInfo.innerHTML = `
    Ditemukan ${results.length} rekomendasi profesi untuk:
    <b>"${originalQuery}"</b>
    ${processedQuery !== originalQuery
      ? `<br><small>AI NLP memahami sebagai: <b>${processedQuery}</b></small>`
      : ''
    }
  `;

  resultsContainer.innerHTML = results.map(item=>`

    <div class="card">

      <div class="kode">
        ${item.kode}
      </div>

      <div class="profesi">
        ${item.profesi}
      </div>

      <div class="keyword">
        ${item.keyword || '-'}
      </div>

      <div class="meta-row">

        <div class="meta-pill">
          🤖 AI Match ${Math.min(item.aiScore,99)}%
        </div>

        <div class="meta-pill">
          🧠 ${item.hierarchy}
        </div>

      </div>

      ${item.related.length > 0
        ? `
          <div class="related-box">

            <div class="related-title">
              Profesi terkait:
            </div>

            <div class="related-list">

              ${item.related.map(rel => `
                <div class="related-item">
                  ${rel}
                </div>
              `).join('')}

            </div>

          </div>
        `
        : ''
      }

    </div>

  `).join('');

}

searchInput.addEventListener('input',(e)=>{
  search(e.target.value);
});

loadData();

</script>

</body>
</html>
